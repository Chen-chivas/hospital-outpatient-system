<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择医生 - 门诊挂号系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-light: #eff6ff; --primary-dark: #1d4ed8;
            --success: #059669; --text: #1e293b; --text-muted: #64748b;
            --bg: #f8fafc; --card-bg: #ffffff; --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,.06);
            --shadow-lg: 0 10px 30px rgba(0,0,0,.1);
            --radius: 16px; --radius-sm: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #f0f9ff 0%, #faf5ff 30%, #f0fdf4 70%, #fffbeb 100%);
            min-height: 100vh; color: var(--text);
        }
        .navbar-custom {
            background: rgba(255,255,255,.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; padding: 0 24px;
        }
        .nav-inner { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
        .brand .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
        .user-badge { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--primary-light); border-radius: 20px; font-size: 14px; font-weight: 500; color: var(--primary); }
        .avatar-sm { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .main-container { max-width: 1120px; margin: 0 auto; padding: 32px 24px 80px; }
        .breadcrumb-custom { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; font-size: 14px; flex-wrap: wrap; }
        .breadcrumb-custom a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb-custom a:hover { color: var(--primary); }
        .breadcrumb-custom .sep { color: #cbd5e1; }
        .breadcrumb-custom .current { color: var(--text); font-weight: 600; }
        .steps { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 32px; }
        .step { display: flex; align-items: center; gap: 8px; padding: 8px 20px; background: #fff; border: 1px solid var(--border); border-radius: 24px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .step.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(37,99,235,.25); }
        .step.done { background: #ecfdf5; color: var(--success); border-color: #a7f3d0; }
        .step-line { width: 40px; height: 2px; background: var(--border); }
        .step-line.done { background: var(--success); }
        .page-header { text-align: center; margin-bottom: 28px; }
        .page-header h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
        .date-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; background: var(--primary-light); color: var(--primary); border-radius: 20px; font-size: 14px; font-weight: 600; }
        .doctor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .doctor-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 28px 24px;
            box-shadow: var(--shadow); transition: all .25s ease;
            display: flex; gap: 18px; cursor: pointer; position: relative; overflow: hidden; text-decoration: none; color: inherit;
        }
        .doctor-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .doctor-card .card-accent { position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: linear-gradient(180deg, var(--primary), #6366f1); border-radius: 0 4px 4px 0; }
        .doc-avatar { width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #fff; }
        .av-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .av-green { background: linear-gradient(135deg, #10b981, #059669); }
        .av-purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .av-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
        .av-rose { background: linear-gradient(135deg, #f43f5e, #e11d48); }
        .av-cyan { background: linear-gradient(135deg, #06b6d4, #0891b2); }
        .doctor-info { flex: 1; min-width: 0; }
        .doctor-info .doc-name { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
        .doctor-info .doc-title { font-size: 13px; color: var(--primary); font-weight: 500; margin-bottom: 8px; }
        .doctor-info .doc-meta { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-muted); }
        .doctor-info .doc-meta span { display: flex; align-items: center; gap: 6px; }
        .doctor-card .select-hint { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--primary); }
        .empty-state { grid-column: 1 / -1; background: #fff; border: 2px dashed var(--border); border-radius: var(--radius); padding: 60px 20px; text-align: center; color: var(--text-muted); }
        .empty-state i { font-size: 56px; display: block; margin-bottom: 12px; opacity: .4; }
        .empty-state h4 { font-size: 18px; margin-bottom: 6px; color: var(--text); }
        .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; background: var(--primary); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 16px; transition: all .2s; }
        .btn-back:hover { background: var(--primary-dark); }
        @media (max-width: 720px) { .doctor-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<nav class="navbar-custom">
    <div class="nav-inner">
        <a href="/outpatient" class="brand"><div class="logo-icon"><i class="bi bi-hospital"></i></div>门诊挂号系统</a>
        <div class="user-badge" th:if="${userName != null}">
            <div class="avatar-sm" th:text="${userName.length() >= 2 ? userName.substring(userName.length() - 2) : userName}">患</div>
            <span th:text="${userName}"></span>
        </div>
    </div>
</nav>
<div class="main-container">
    <div class="breadcrumb-custom">
        <a href="/outpatient"><i class="bi bi-house"></i> 首页</a><span class="sep">›</span>
        <a href="/outpatient">选择科室</a><span class="sep">›</span>
        <span class="current">选择医生</span>
    </div>
    <div class="steps">
        <span class="step done"><i class="bi bi-check-circle"></i> 日期与科室</span>
        <span class="step-line done"></span>
        <span class="step active"><i class="bi bi-2-circle-fill"></i> 选择医生</span>
        <span class="step-line"></span>
        <span class="step">选择时段</span>
        <span class="step-line"></span>
        <span class="step">确认挂号</span>
    </div>
    <div class="page-header">
        <h2>选择出诊医生</h2>
        <div class="date-badge">
            <i class="bi bi-calendar-check"></i>
            <span th:text="${#temporals.format(visitDate, 'yyyy年MM月dd日')}"></span>
        </div>
    </div>

    <!-- 医生列表 -->
    <div class="doctor-grid" th:if="${!#lists.isEmpty(scheduleList)}">
        <a th:each="item : ${scheduleList}" class="doctor-card"
           th:href="@{/outpatient/reg/number(scheduleId=${item.scheduleId}, visitDate=${visitDate})}">
            <div class="card-accent"></div>
            <div class="doc-avatar" th:class="${item.avatarClass}" th:text="${item.avatarChar}">医</div>
            <div class="doctor-info">
                <div class="doc-name" th:text="${item.doctorName}"></div>
                <div class="doc-title" th:text="${item.doctorTitle}"></div>
                <div class="doc-meta">
                    <span><i class="bi bi-clock"></i> <span th:text="${item.startTime} + ' ~ ' + ${item.endTime}"></span></span>
                    <span><i class="bi bi-cash-coin"></i> 挂号费 <b th:text="${item.registrationFee} + ' 元'" style="color:#e11d48;"></b></span>
                </div>
                <div class="select-hint"><i class="bi bi-hand-index"></i> 点击选择此医生</div>
            </div>
        </a>
    </div>

    <!-- 空状态 -->
    <div class="empty-state" th:if="${#lists.isEmpty(scheduleList)}">
        <i class="bi bi-calendar-x"></i>
        <h4>该日期暂无排班信息</h4>
        <p>请选择其他日期或返回重新选择科室</p>
        <a href="/outpatient" class="btn-back"><i class="bi bi-arrow-left"></i> 返回首页</a>
    </div>
</div>
</body>
</html>
