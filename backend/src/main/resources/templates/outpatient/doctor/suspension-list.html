<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的停诊申请</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="text-center mb-4">我的停诊申请</h2>

            <div th:if="${successMsg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>成功！</strong> <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <a href="/outpatient/doctor/suspension/apply" class="btn btn-primary mb-3">提交新申请</a>
            <a href="/outpatient/doctor" class="btn btn-secondary mb-3 ms-2">返回医生首页</a>

            <div class="card">
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>申请时间</th>
                            <th>停诊日期</th>
                            <th>停诊原因</th>
                            <th>审核状态</th>
                            <th>审核意见</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="app : ${applications}">
                            <td th:text="${#temporals.format(app.applyTime, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${#temporals.format(app.suspensionDate, 'yyyy-MM-dd')}"></td>
                            <td th:text="${app.reason}"></td>
                            <td>
                                        <span th:switch="${app.status}">
                                            <span th:case="'PENDING'" class="badge bg-warning text-dark">待审核</span>
                                            <span th:case="'APPROVED'" class="badge bg-success">已通过</span>
                                            <span th:case="'REJECTED'" class="badge bg-danger">已驳回</span>
                                        </span>
                            </td>
                            <td th:text="${app.auditComment != null ? app.auditComment : '暂无'}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(applications)}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <h5>暂无申请记录</h5>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
