<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>提交停诊申请</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">提交停诊申请</h2>

            <div th:if="${successMsg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>成功！</strong> <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMsg != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>失败！</strong> <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form action="/outpatient/doctor/suspension/submit" method="post">
                <div class="mb-3">
                    <label for="suspensionDate" class="form-label">停诊日期</label>
                    <input type="date" class="form-control" id="suspensionDate" name="suspensionDate" required>
                    <div class="form-text">请选择需要停诊的日期，建议提前7天申请</div>
                </div>
                <div class="mb-3">
                    <label for="reason" class="form-label">停诊原因</label>
                    <textarea class="form-control" id="reason" name="reason" rows="3" required></textarea>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">提交申请</button>
                    <a href="/outpatient/doctor" class="btn btn-secondary">返回</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 设置日期选择器的最小值为明天
    window.onload = function() {
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        document.getElementById('suspensionDate').min = formatDate(tomorrow);
    }
</script>
</body>
</html>
