<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>排班管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-light: #eff6ff;
            --success: #059669; --danger: #dc2626;
            --text: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0; --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f8fafc; min-height: 100vh; color: var(--text);
        }

        .navbar-custom {
            background: #fff; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000; padding: 0 24px;
        }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
        .brand .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #dc2626, #b91c1c); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
        .nav-links { display: flex; gap: 6px; }
        .nav-link-item {
            padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
            text-decoration: none; transition: all .2s; color: var(--text-muted);
        }
        .nav-link-item:hover, .nav-link-item.active { background: var(--primary-light); color: var(--primary); }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

        .alert-custom {
            padding: 14px 20px; border-radius: var(--radius); margin-bottom: 20px;
            font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px;
        }
        .alert-custom.success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .alert-custom.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

        .card-custom {
            background: #fff; border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: 0 1px 3px rgba(0,0,0,.06);
            overflow: hidden; margin-bottom: 24px;
        }
        .card-custom .card-header-custom {
            padding: 18px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; background: #fafbfc;
        }
        .card-header-custom h5 { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }

        .filter-form { padding: 20px 24px; }
        .btn-sm-custom {
            padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
            border: none; cursor: pointer; transition: all .15s; text-decoration: none; display: inline-block;
        }
        .btn-edit { background: var(--primary); color: #fff; }
        .btn-edit:hover { background: #1d4ed8; }
        .btn-delete { background: #fff; color: var(--danger); border: 1px solid #fecaca; }
        .btn-delete:hover { background: #fef2f2; }

        table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); }
        th { padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); background: #f8fafc; border: 1px solid var(--border); }
        td { padding: 12px 16px; border: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
        tr:hover td { background: #fafbfc; }

        .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }
        .empty-state i { font-size: 56px; display: block; margin-bottom: 12px; opacity: .3; }
        .empty-state h5 { font-size: 18px; margin-bottom: 6px; color: var(--text); }
    </style>
</head>
<body>

<nav class="navbar-custom">
    <div class="nav-inner">
        <a href="/outpatient/admin/schedule" class="brand">
            <div class="logo-icon"><i class="bi bi-shield-lock"></i></div>
            管理后台
        </a>
        <div class="nav-links">
            <a href="/outpatient/admin/schedule" class="nav-link-item active"><i class="bi bi-calendar3"></i> 排班管理</a>
            <a href="/outpatient/admin/schedule/suspension" class="nav-link-item"><i class="bi bi-clipboard-check"></i> 停诊审核</a>
            <a href="/outpatient/admin/schedule/blacklist" class="nav-link-item"><i class="bi bi-person-x"></i> 黑名单</a>
            <a href="/outpatient/reg/login" class="nav-link-item"><i class="bi bi-house"></i> 首页</a>
        </div>
    </div>
</nav>

<div class="main-container">
    <!-- 提示 -->
    <div th:if="${successMsg != null}" class="alert-custom success" id="successAlert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMsg}"></span>
        <button style="margin-left:auto;background:none;border:none;font-size:18px;opacity:.5;cursor:pointer;" onclick="this.parentElement.remove()">&times;</button>
    </div>
    <div th:if="${errorMsg != null}" class="alert-custom error" id="errorAlert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMsg}"></span>
        <button style="margin-left:auto;background:none;border:none;font-size:18px;opacity:.5;cursor:pointer;" onclick="this.parentElement.remove()">&times;</button>
    </div>

    <!-- 筛选 -->
    <div class="card-custom">
        <div class="filter-form">
            <form method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold" style="font-size:13px;">选择日期</label>
                    <input type="date" class="form-control" name="date" th:value="${#temporals.format(selectedDate, 'yyyy-MM-dd')}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold" style="font-size:13px;">选择科室</label>
                    <select class="form-select" name="deptId">
                        <option value="">全部科室</option>
                        <option value="1" th:selected="${selectedDeptId == 1}">内科</option>
                        <option value="2" th:selected="${selectedDeptId == 2}">外科</option>
                        <option value="3" th:selected="${selectedDeptId == 3}">儿科</option>
                        <option value="4" th:selected="${selectedDeptId == 4}">妇产科</option>
                        <option value="5" th:selected="${selectedDeptId == 5}">骨科</option>
                        <option value="6" th:selected="${selectedDeptId == 6}">眼科</option>
                        <option value="7" th:selected="${selectedDeptId == 7}">皮肤科</option>
                        <option value="8" th:selected="${selectedDeptId == 8}">神经内科</option>
                        <option value="9" th:selected="${selectedDeptId == 9}">心血管内科</option>
                        <option value="10" th:selected="${selectedDeptId == 10}">耳鼻喉科</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> 查询</button>
                </div>
                <div class="col-md-2">
                    <a href="/outpatient/admin/schedule/add" class="btn btn-success w-100"><i class="bi bi-plus-circle"></i> 新增排班</a>
                </div>
                <div class="col-md-2">
                    <a href="/outpatient/admin/schedule/suspension" class="btn btn-warning w-100 text-white"><i class="bi bi-clipboard-check"></i> 停诊审核</a>
                </div>
            </form>
        </div>
    </div>

    <!-- 排班列表 -->
    <div class="card-custom">
        <div class="card-header-custom">
            <h5><i class="bi bi-calendar3" style="color:var(--primary);"></i> 排班列表</h5>
            <span style="font-size:13px;color:var(--text-muted);">共 <b th:text="${#lists.size(schedules)}">0</b> 条记录</span>
        </div>

        <div th:if="${!#lists.isEmpty(schedules)}">
            <table>
                <thead>
                <tr>
                    <th>排班ID</th>
                    <th>就诊日期</th>
                    <th>医生</th>
                    <th>科室</th>
                    <th>时间</th>
                    <th>时段数</th>
                    <th>号源/时段</th>
                    <th>挂号费</th>
                    <th>状态</th>
                    <th style="width:140px;">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="schedule : ${schedules}">
                    <td th:text="${schedule.scheduleId}"></td>
                    <td th:text="${#temporals.format(schedule.scheduleDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${doctorNameMap.get(schedule.doctorId)}"></td>
                    <td>
                        <span th:switch="${schedule.deptId}">
                            <span th:case="1">内科</span><span th:case="2">外科</span>
                            <span th:case="3">儿科</span><span th:case="4">妇产科</span>
                            <span th:case="5">骨科</span><span th:case="6">眼科</span>
                            <span th:case="7">皮肤科</span><span th:case="8">神经内科</span>
                            <span th:case="9">心血管内科</span><span th:case="10">耳鼻喉科</span>
                            <span th:case="*">科室#<span th:text="${schedule.deptId}"></span></span>
                        </span>
                    </td>
                    <td th:text="${schedule.startTime} + '~' + ${schedule.endTime}"></td>
                    <td th:text="${schedule.totalSlots}"></td>
                    <td th:text="${schedule.slotsPerTime}"></td>
                    <td><b style="color:#e11d48;" th:text="'¥' + ${schedule.registrationFee}"></b></td>
                    <td>
                        <span class="badge" th:classappend="${schedule.status == 1} ? 'bg-success' : 'bg-secondary'"
                              th:text="${schedule.status == 1} ? '正常' : '已取消'"></span>
                    </td>
                    <td>
                        <a th:href="@{/outpatient/admin/schedule/edit/{id}(id=${schedule.scheduleId})}" class="btn-sm-custom btn-edit me-1">
                            <i class="bi bi-pencil"></i> 编辑
                        </a>
                        <a th:href="@{/outpatient/admin/schedule/delete/{id}(id=${schedule.scheduleId})}" class="btn-sm-custom btn-delete"
                           onclick="return confirm('确认删除此排班？关联订单将自动取消。')">
                            <i class="bi bi-trash"></i> 删除
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(schedules)}">
            <i class="bi bi-calendar-x"></i>
            <h5>暂无排班信息</h5>
            <p>点击上方"新增排班"添加，或调整筛选条件</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => {
        document.querySelectorAll('.alert-custom').forEach(a => {
            a.style.transition = 'opacity .3s'; a.style.opacity = '0';
            setTimeout(() => a.remove(), 350);
        });
    }, 4000);
</script>
</body>
</html>
