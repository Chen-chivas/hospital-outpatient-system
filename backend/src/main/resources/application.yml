spring:
  application:
    name: ocs-backend
  datasource:
    url: jdbc:h2:file:./.data/ocs;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  thymeleaf:
    cache: false
    encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

ocs:
  cors:
    allowed-origins: "*"
  security:
    jwt:
      issuer: ocs-backend
      secret: dev-secret-change-me
      expires-minutes: 720
