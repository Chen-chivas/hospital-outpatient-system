<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择就诊人 - 医院门诊挂号系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
            --shadow-lg: 0 10px 25px rgba(0,0,0,.1);
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 30%, #ecfdf5 70%, #fefce8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 80%, rgba(37, 99, 235, .06) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(5, 150, 105, .06) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(217, 119, 6, .04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header .icon-circle {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, .3);
        }
        .login-header .icon-circle i {
            font-size: 36px;
            color: #fff;
        }
        .login-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .patient-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .patient-card .card-top {
            padding: 24px 28px 0;
        }
        .patient-card .card-top h5 {
            font-weight: 700;
            color: var(--text);
            font-size: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .patient-card .card-top h5 i { color: var(--primary); font-size: 18px; }
        .patient-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .patient-list::-webkit-scrollbar { width: 4px; }
        .patient-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .patient-option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all .2s ease;
            background: #fafbfc;
        }
        .patient-option:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateX(4px);
        }
        .patient-option.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }
        .patient-option .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }
        .patient-option .info { flex: 1; min-width: 0; }
        .patient-option .info .name {
            font-weight: 600;
            color: var(--text);
            font-size: 15px;
        }
        .patient-option .info .detail {
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            gap: 12px;
            margin-top: 2px;
        }
        .role-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }
        .role-patient { background: #ecfdf5; color: #059669; }
        .role-doctor { background: #eff6ff; color: #2563eb; }
        .role-admin { background: #fef3c7; color: #92400e; }
        .patient-option .radio-indicator {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all .2s;
        }
        .patient-option.selected .radio-indicator {
            border-color: var(--primary);
            background: var(--primary);
        }
        .patient-option.selected .radio-indicator::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
        }
        .card-bottom {
            padding: 20px 28px 24px;
            border-top: 1px solid var(--border);
            margin-top: 20px;
        }
        .btn-confirm {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #fff;
            transition: all .2s;
            cursor: pointer;
        }
        .btn-confirm:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, .35);
        }
        .btn-confirm:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .toast-msg {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            animation: slideDown .3s ease;
            box-shadow: var(--shadow-lg);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .toast-msg.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 48px; display: block; margin-bottom: 12px; opacity: .5; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <div class="icon-circle">
            <i class="bi bi-hospital"></i>
        </div>
        <h2>医院门诊挂号系统</h2>
        <p>请选择您的身份以进入系统</p>
    </div>

    <div class="patient-card">
        <div class="card-top">
            <h5><i class="bi bi-people-fill"></i> 选择用户</h5>
            <div class="patient-list" id="patientList">
                <div class="patient-option selected"
                     data-id="4" data-role="PATIENT">
                    <div class="avatar">患者</div>
                    <div class="info">
                        <div class="name">
                            <span>刘患者</span>
                            <span class="role-badge role-patient">患者</span>
                            
                            
                        </div>
                        <div class="detail">
                            <span>男</span>
                            <span>35岁</span>
