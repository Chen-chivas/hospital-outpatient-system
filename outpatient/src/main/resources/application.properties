spring.application.name=outpatient

# 服务器配置（Spring Boot 3.2+ 新写法，无警告）
server.port=8081
server.encoding.charset=UTF-8
server.encoding.enabled=true
server.encoding.force=true

# Thymeleaf页面模板配置
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML5
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# 数据库连接核心配置（只需要改密码）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/hospital?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=root
# 改成你自己的MySQL密码！！！这是唯一需要改的地方
spring.datasource.password=123456

# MyBatis-Plus配置（不用改）
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.hospital.outpatient.entity

# 日志配置（不用改）
logging.level.com.hospital.outpatient=debug
logging.level.org.springframework.jdbc.core.JdbcTemplate=debug
logging.level.org.springframework.web=info
