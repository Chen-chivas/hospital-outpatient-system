<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>停诊申请审核</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">停诊申请审核</h1>

            <div th:if="${successMsg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>成功！</strong> <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMsg != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>失败！</strong> <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <a href="/admin/schedule" class="btn btn-secondary mb-3">返回排班管理</a>

            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5>待审核申请</h5>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>申请时间</th>
                            <th>医生ID</th>
                            <th>停诊日期</th>
                            <th>停诊原因</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="app : ${applications}">
                            <td th:text="${#temporals.format(app.applyTime, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${app.doctorId}"></td>
                            <td th:text="${#temporals.format(app.suspensionDate, 'yyyy-MM-dd')}"></td>
                            <td th:text="${app.reason}"></td>
                            <td>
                                <button type="button" class="btn btn-sm btn-success me-1"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#approveModal' + ${app.applicationId}">
                                    通过
                                </button>
                                <button type="button" class="btn btn-sm btn-danger"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#rejectModal' + ${app.applicationId}">
                                    驳回
                                </button>

                                <!-- 通过确认模态框 -->
                                <div class="modal fade" th:id="'approveModal' + ${app.applicationId}" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">确认通过申请</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body">
                                                <p>确认通过该停诊申请吗？</p>
                                                <p class="text-danger">⚠️ 通过后系统将自动取消该医生当天的所有排班和订单</p>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                                                <form action="/admin/schedule/suspension/audit" method="post">
                                                    <input type="hidden" name="applicationId" th:value="${app.applicationId}">
                                                    <input type="hidden" name="status" value="APPROVED">
                                                    <button type="submit" class="btn btn-success">确认通过</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 驳回确认模态框 -->
                                <div class="modal fade" th:id="'rejectModal' + ${app.applicationId}" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">驳回申请</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body">
                                                <div class="mb-3">
                                                    <label class="form-label">驳回原因</label>
                                                    <textarea class="form-control" name="auditComment" rows="3" required></textarea>
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                                                <form action="/admin/schedule/suspension/audit" method="post">
                                                    <input type="hidden" name="applicationId" th:value="${app.applicationId}">
                                                    <input type="hidden" name="status" value="REJECTED">
                                                    <button type="submit" class="btn btn-danger">确认驳回</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(applications)}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <h5>暂无待审核的申请</h5>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
