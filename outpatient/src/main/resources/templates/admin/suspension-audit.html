<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停诊审核 - 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-light: #eff6ff;
            --success: #059669; --success-light: #ecfdf5;
            --danger: #dc2626; --danger-light: #fef2f2;
            --warning: #d97706; --warning-light: #fffbeb;
            --text: #1e293b; --text-muted: #64748b;
            --bg: #f8fafc; --card-bg: #fff; --border: #e2e8f0;
            --radius: 16px; --radius-sm: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh; color: var(--text);
        }

        /* 导航 */
        .navbar-custom {
            background: #fff; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000; padding: 0 24px;
        }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
        .brand .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #dc2626, #b91c1c); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
        .nav-links { display: flex; gap: 6px; }
        .nav-link-item {
            padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
            text-decoration: none; transition: all .2s; color: var(--text-muted);
        }
        .nav-link-item:hover, .nav-link-item.active { background: var(--primary-light); color: var(--primary); }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

        /* 提示 */
        .alert-custom {
            padding: 14px 20px; border-radius: var(--radius-sm); margin-bottom: 20px;
            font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px;
        }
        .alert-custom.success { background: var(--success-light); color: var(--success); border: 1px solid #a7f3d0; }
        .alert-custom.error { background: var(--danger-light); color: var(--danger); border: 1px solid #fecaca; }
        .alert-custom .close-btn { margin-left: auto; cursor: pointer; background: none; border: none; font-size: 18px; opacity: .5; }

        /* 统计卡片 */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px 24px;
            box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px;
        }
        .stat-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .stat-num { font-size: 28px; font-weight: 800; }
        .stat-label { font-size: 13px; color: var(--text-muted); }

        /* 卡片 */
        .card-custom {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow);
            overflow: hidden; margin-bottom: 24px;
        }
        .card-custom .card-header-custom {
            padding: 18px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            background: #fafbfc;
        }
        .card-header-custom h5 { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }

        /* 表格 */
        .table-custom { width: 100%; border-collapse: collapse; }
        .table-custom th {
            padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted);
            background: #f8fafc; border-bottom: 2px solid var(--border);
        }
        .table-custom td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; font-size: 14px; vertical-align: middle; }
        .table-custom tr:hover td { background: #fafbfc; }

        .badge-status {
            padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-approved { background: #d1fae5; color: #065f46; }
        .badge-rejected { background: #fee2e2; color: #991b1b; }

        .btn-sm-custom {
            padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
            border: none; cursor: pointer; transition: all .15s;
        }
        .btn-approve { background: var(--success); color: #fff; }
        .btn-approve:hover { background: #047857; }
        .btn-reject { background: var(--danger); color: #fff; }
        .btn-reject:hover { background: #b91c1c; }

        .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }
        .empty-state i { font-size: 56px; display: block; margin-bottom: 12px; opacity: .3; }
        .empty-state h5 { font-size: 18px; margin-bottom: 6px; color: var(--text); }

        /* 模态框美化 */
        .modal-content { border-radius: var(--radius); border: none; }
        .modal-header { border-bottom: 1px solid var(--border); }
        .modal-footer { border-top: 1px solid var(--border); }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: 1fr 1fr; }
            .table-custom { font-size: 12px; }
            .table-custom th, .table-custom td { padding: 8px 10px; }
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar-custom">
    <div class="nav-inner">
        <a href="/admin/schedule" class="brand">
            <div class="logo-icon"><i class="bi bi-shield-lock"></i></div>
            管理后台
        </a>
        <div class="nav-links">
            <a href="/admin/schedule" class="nav-link-item"><i class="bi bi-calendar3"></i> 排班管理</a>
            <a href="/admin/schedule/suspension" class="nav-link-item active"><i class="bi bi-clipboard-check"></i> 停诊审核</a>
            <a href="/admin/schedule/blacklist" class="nav-link-item"><i class="bi bi-person-x"></i> 黑名单</a>
            <a href="/" class="nav-link-item"><i class="bi bi-house"></i> 首页</a>
        </div>
    </div>
</nav>

<div class="main-container">
    <!-- 提示消息 -->
    <div th:if="${successMsg != null}" class="alert-custom success" id="successAlert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMsg}"></span>
        <button class="close-btn" onclick="this.parentElement.remove()">&times;</button>
    </div>
    <div th:if="${errorMsg != null}" class="alert-custom error" id="errorAlert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMsg}"></span>
        <button class="close-btn" onclick="this.parentElement.remove()">&times;</button>
    </div>

    <!-- 统计 -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon" style="background:#fef3c7;color:#92400e;"><i class="bi bi-hourglass-split"></i></div>
            <div>
                <div class="stat-num" th:text="${#lists.size(applications)}">0</div>
                <div class="stat-label">待审核申请</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background:#ecfdf5;color:#059669;"><i class="bi bi-check2-all"></i></div>
            <div>
                <div class="stat-num" th:text="${#lists.size(allApplications != null ? allApplications : applications)}">0</div>
                <div class="stat-label">全部申请记录</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background:#eff6ff;color:#2563eb;"><i class="bi bi-people"></i></div>
            <div>
                <div class="stat-num" th:text="${doctorNameMap != null ? #maps.size(doctorNameMap) : 0}">0</div>
                <div class="stat-label">在册医生</div>
            </div>
        </div>
    </div>

    <!-- ===== 待审核申请 ===== -->
    <div class="card-custom">
        <div class="card-header-custom">
            <h5><i class="bi bi-clipboard-check" style="color:#d97706;"></i> 待审核申请</h5>
            <span class="badge-status badge-pending" th:text="'共 ' + ${#lists.size(applications)} + ' 条'"></span>
        </div>

        <div th:if="${!#lists.isEmpty(applications)}">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>申请时间</th>
                    <th>医生</th>
                    <th>停诊日期</th>
                    <th>停诊原因</th>
                    <th style="width:160px;">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="app : ${applications}">
                    <td th:text="${#temporals.format(app.applyTime, 'MM-dd HH:mm')}"></td>
                    <td>
                        <strong th:text="${doctorNameMap != null ? doctorNameMap.get(app.doctorId) : '医生#' + app.doctorId}"></strong>
                    </td>
                    <td>
                        <span class="badge-status badge-pending" th:text="${#temporals.format(app.suspensionDate, 'yyyy-MM-dd')}"></span>
                    </td>
                    <td th:text="${app.reason}"></td>
                    <td>
                        <button class="btn-sm-custom btn-approve me-1" data-bs-toggle="modal"
                                th:data-bs-target="'#approveModal' + ${app.applicationId}">
                            <i class="bi bi-check-lg"></i> 通过
                        </button>
                        <button class="btn-sm-custom btn-reject" data-bs-toggle="modal"
                                th:data-bs-target="'#rejectModal' + ${app.applicationId}">
                            <i class="bi bi-x-lg"></i> 驳回
                        </button>

                        <!-- 通过确认弹窗 -->
                        <div class="modal fade" th:id="'approveModal' + ${app.applicationId}" tabindex="-1">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header bg-success text-white">
                                        <h5 class="modal-title"><i class="bi bi-check-circle"></i> 确认通过</h5>
                                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <p>确认通过 <strong th:text="${doctorNameMap != null ? doctorNameMap.get(app.doctorId) : '该医生'}"></strong>
                                           在 <strong th:text="${#temporals.format(app.suspensionDate, 'yyyy年MM月dd日')}"></strong> 的停诊申请？</p>
                                        <div class="alert alert-warning py-2 mb-0">
                                            ⚠️ 通过后系统将自动取消该医生当天的所有排班和订单
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                                        <form th:action="@{/admin/schedule/suspension/audit}" method="post" style="display:inline;">
                                            <input type="hidden" name="applicationId" th:value="${app.applicationId}">
                                            <input type="hidden" name="status" value="APPROVED">
                                            <button type="submit" class="btn btn-success">确认通过</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 驳回弹窗 -->
                        <div class="modal fade" th:id="'rejectModal' + ${app.applicationId}" tabindex="-1">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header bg-danger text-white">
                                        <h5 class="modal-title"><i class="bi bi-x-circle"></i> 驳回申请</h5>
                                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                    </div>
                                    <form th:action="@{/admin/schedule/suspension/audit}" method="post">
                                        <div class="modal-body">
                                            <p>驳回 <strong th:text="${doctorNameMap != null ? doctorNameMap.get(app.doctorId) : '该医生'}"></strong> 的停诊申请</p>
                                            <div class="mb-3">
                                                <label class="form-label fw-bold">驳回原因（选填）</label>
                                                <textarea class="form-control" name="auditComment" rows="3"
                                                          placeholder="请输入驳回原因..."></textarea>
                                            </div>
                                            <input type="hidden" name="applicationId" th:value="${app.applicationId}">
                                            <input type="hidden" name="status" value="REJECTED">
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                                            <button type="submit" class="btn btn-danger">确认驳回</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" th:if="${#lists.isEmpty(applications)}">
            <i class="bi bi-check-circle"></i>
            <h5>暂无待审核申请</h5>
            <p>所有医生停诊申请已处理完毕</p>
        </div>
    </div>

    <!-- ===== 全部申请记录 ===== -->
    <div class="card-custom" th:if="${allApplications != null && !#lists.isEmpty(allApplications)}">
        <div class="card-header-custom">
            <h5><i class="bi bi-list-ul" style="color:#64748b;"></i> 全部申请记录</h5>
            <span class="badge-status badge-pending" th:text="'共 ' + ${#lists.size(allApplications)} + ' 条'"></span>
        </div>
        <table class="table-custom">
            <thead>
            <tr>
                <th>申请时间</th>
                <th>医生</th>
                <th>停诊日期</th>
                <th>原因</th>
                <th>审核结果</th>
                <th>审核时间</th>
                <th>审核意见</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="app : ${allApplications}">
                <td th:text="${#temporals.format(app.applyTime, 'MM-dd HH:mm')}"></td>
                <td th:text="${doctorNameMap != null ? doctorNameMap.get(app.doctorId) : '医生#' + app.doctorId}"></td>
                <td th:text="${#temporals.format(app.suspensionDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${app.reason}"></td>
                <td>
                    <span class="badge-status badge-pending" th:if="${app.status == 'PENDING'}">待审核</span>
                    <span class="badge-status badge-approved" th:if="${app.status == 'APPROVED'}">已通过</span>
                    <span class="badge-status badge-rejected" th:if="${app.status == 'REJECTED'}">已驳回</span>
                </td>
                <td th:text="${app.auditTime != null ? #temporals.format(app.auditTime, 'MM-dd HH:mm') : '-'}"></td>
                <td th:text="${app.auditComment != null ? app.auditComment : '-'}" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 自动关闭提示
    setTimeout(() => {
        document.querySelectorAll('.alert-custom').forEach(a => {
            a.style.transition = 'opacity .3s'; a.style.opacity = '0';
            setTimeout(() => a.remove(), 350);
        });
    }, 4000);

    // 驳回弹窗：把 textarea 的值在提交前写入表单
    document.querySelectorAll('.modal form').forEach(form => {
        form.addEventListener('submit', function(e) {
            const textarea = this.querySelector('textarea');
            if (textarea && !textarea.value.trim()) {
                textarea.value = '无'; // 默认值
            }
        });
    });
</script>
</body>
</html>
