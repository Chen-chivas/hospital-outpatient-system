<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑名单管理 - 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-light: #eff6ff;
            --success: #059669; --danger: #dc2626; --danger-light: #fef2f2;
            --warning: #d97706; --warning-light: #fffbeb;
            --text: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0; --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh; color: var(--text);
        }

        .navbar-custom {
            background: #fff; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000; padding: 0 24px;
        }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
        .brand .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #dc2626, #b91c1c); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
        .nav-links { display: flex; gap: 6px; }
        .nav-link-item {
            padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
            text-decoration: none; transition: all .2s; color: var(--text-muted);
        }
        .nav-link-item:hover, .nav-link-item.active { background: var(--primary-light); color: var(--primary); }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

        .alert-custom {
            padding: 14px 20px; border-radius: var(--radius); margin-bottom: 20px;
            font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px;
        }
        .alert-custom.success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .alert-custom.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

        .page-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
        .page-header h2 { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }

        .card-custom {
            background: #fff; border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: 0 1px 3px rgba(0,0,0,.06);
            overflow: hidden; margin-bottom: 24px;
        }
        .card-custom .card-header-custom {
            padding: 18px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; background: #fafbfc;
        }
        .card-header-custom h5 { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); background: #f8fafc; border-bottom: 2px solid var(--border); }
        td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 14px; vertical-align: middle; }
        tr:hover td { background: #fafbfc; }

        .btn-sm-custom {
            padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
            border: none; cursor: pointer; transition: all .15s; text-decoration: none; display: inline-block;
        }
        .btn-unblock { background: var(--success); color: #fff; }
        .btn-unblock:hover { background: #047857; }
        .btn-reset { background: #fff; color: var(--warning); border: 1px solid #fcd34d; }
        .btn-reset:hover { background: var(--warning-light); }

        .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }
        .empty-state i { font-size: 56px; display: block; margin-bottom: 12px; opacity: .3; }
        .empty-state h5 { font-size: 18px; margin-bottom: 6px; color: var(--text); }

        .form-section { padding: 24px; }
        .form-label-sm { font-size: 13px; font-weight: 700; margin-bottom: 6px; display: block; }
    </style>
</head>
<body>

<nav class="navbar-custom">
    <div class="nav-inner">
        <a href="/admin/schedule" class="brand">
            <div class="logo-icon"><i class="bi bi-shield-lock"></i></div>
            管理后台
        </a>
        <div class="nav-links">
            <a href="/admin/schedule" class="nav-link-item"><i class="bi bi-calendar3"></i> 排班管理</a>
            <a href="/admin/schedule/suspension" class="nav-link-item"><i class="bi bi-clipboard-check"></i> 停诊审核</a>
            <a href="/admin/schedule/blacklist" class="nav-link-item active"><i class="bi bi-person-x"></i> 黑名单</a>
            <a href="/" class="nav-link-item"><i class="bi bi-house"></i> 首页</a>
        </div>
    </div>
</nav>

<div class="main-container">
    <!-- 提示 -->
    <div th:if="${successMsg != null}" class="alert-custom success" id="successAlert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMsg}"></span>
        <button style="margin-left:auto;background:none;border:none;font-size:18px;opacity:.5;cursor:pointer;" onclick="this.parentElement.remove()">&times;</button>
    </div>
    <div th:if="${errorMsg != null}" class="alert-custom error" id="errorAlert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMsg}"></span>
        <button style="margin-left:auto;background:none;border:none;font-size:18px;opacity:.5;cursor:pointer;" onclick="this.parentElement.remove()">&times;</button>
    </div>

    <div class="page-header">
        <h2><i class="bi bi-person-x" style="color:#dc2626;"></i> 挂号黑名单管理</h2>
    </div>

    <!-- 手动拉黑 -->
    <div class="card-custom">
        <div class="card-header-custom">
            <h5><i class="bi bi-person-plus" style="color:#dc2626;"></i> 手动添加黑名单</h5>
        </div>
        <div class="form-section">
            <form th:action="@{/admin/schedule/blacklist/add}" method="post" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label-sm">选择患者</label>
                    <select class="form-select" name="patientId" required>
                        <option value="">-- 请选择患者 --</option>
                        <option th:each="p : ${allPatients}"
                                th:value="${p.get('patientId')}"
                                th:text="${p.get('realName')} + '（' + ${p.get('gender')} + ' ' + ${p.get('age')} + '岁）'">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <p class="text-muted mb-0" style="font-size:13px;">
                        <i class="bi bi-info-circle"></i> 拉黑后该患者 30 天内无法挂号
                    </p>
                </div>
                <div class="col-md-4 text-end">
                    <button type="submit" class="btn btn-danger"><i class="bi bi-shield-x"></i> 拉黑 30 天</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 黑名单列表 -->
    <div class="card-custom">
        <div class="card-header-custom">
            <h5><i class="bi bi-list-ul" style="color:#dc2626;"></i> 生效中的黑名单</h5>
            <span style="font-size:13px;color:var(--text-muted);">共 <b th:text="${#lists.size(blacklist)}">0</b> 人</span>
        </div>

        <div th:if="${!#lists.isEmpty(blacklist)}">
            <table>
                <thead>
                <tr>
                    <th>患者姓名</th>
                    <th>患者ID</th>
                    <th>累计爽约</th>
                    <th>封禁开始</th>
                    <th>封禁结束</th>
                    <th>剩余天数</th>
                    <th style="width:180px;">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${blacklist}">
                    <td>
                        <strong th:text="${patientNameMap != null ? patientNameMap.get(item.patientId) : '患者#' + item.patientId}"></strong>
                    </td>
                    <td th:text="${item.patientId}"></td>
                    <td>
                        <span class="badge bg-danger" th:text="${item.missedCount} + ' 次'"></span>
                    </td>
                    <td th:text="${item.limitStartTime != null ? #temporals.format(item.limitStartTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                    <td th:text="${item.limitEndTime != null ? #temporals.format(item.limitEndTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                    <td>
                        <span class="badge bg-warning text-dark" th:if="${item.limitEndTime != null}"
                              th:text="${#temporals.format(item.limitEndTime, 'yyyy-MM-dd') + ' 到期'}"></span>
                    </td>
                    <td>
                        <a th:href="@{/admin/schedule/blacklist/unblock/{id}(id=${item.patientId})}"
                           class="btn-sm-custom btn-unblock me-1"
                           onclick="return confirm('确认解除对「' + (${patientNameMap != null ? patientNameMap.get(item.patientId) : item.patientId}) + '」的黑名单限制吗？')">
                            <i class="bi bi-unlock"></i> 解除拉黑
                        </a>
                        <a th:href="@{/admin/schedule/blacklist/reset/{id}(id=${item.patientId})}"
                           class="btn-sm-custom btn-reset"
                           onclick="return confirm('确认重置' + (${patientNameMap != null ? patientNameMap.get(item.patientId) : item.patientId}) + '的爽约次数吗？')">
                            <i class="bi bi-arrow-repeat"></i> 重置
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(blacklist)}">
            <i class="bi bi-check-circle"></i>
            <h5>暂无生效中的黑名单</h5>
            <p>所有患者均未被限制挂号。系统会在患者累计爽约 3 次后自动拉黑。</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => {
        document.querySelectorAll('.alert-custom').forEach(a => {
            a.style.transition = 'opacity .3s'; a.style.opacity = '0';
            setTimeout(() => a.remove(), 350);
        });
    }, 4000);
</script>
</body>
</html>
