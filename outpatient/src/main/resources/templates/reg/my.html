<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的挂号 - 门诊挂号系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-light: #eff6ff; --primary-dark: #1d4ed8;
            --success: #059669; --success-light: #ecfdf5;
            --danger: #dc2626; --danger-light: #fef2f2;
            --warning: #d97706; --warning-light: #fffbeb;
            --text: #1e293b; --text-muted: #64748b; --text-sub: #94a3b8;
            --bg: #f8fafc; --card-bg: #fff; --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,.1);
            --radius: 16px; --radius-sm: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #f0f9ff 0%, #faf5ff 30%, #f0fdf4 70%, #fffbeb 100%);
            min-height: 100vh; color: var(--text);
        }

        .navbar-custom {
            background: rgba(255,255,255,.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; padding: 0 24px;
        }
        .nav-inner { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
        .brand .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
            text-decoration: none; transition: all .2s; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }
        .nav-btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .nav-btn-outline:hover { background: #f1f5f9; color: var(--text); }
        .nav-btn-primary { background: var(--primary); color: #fff; }
        .nav-btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,.3); }
        .user-badge { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--primary-light); border-radius: 20px; font-size: 14px; font-weight: 500; color: var(--primary); }
        .avatar-sm { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

        .main-container { max-width: 1120px; margin: 0 auto; padding: 32px 24px 80px; }

        /* 页面头 */
        .page-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 28px; }
        .page-header h2 { font-size: 26px; font-weight: 800; }
        .page-header .header-right { display: flex; gap: 10px; }

        /* 统计卡片 */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 14px;
        }
        .stat-card .stat-icon {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .stat-card .stat-num { font-size: 28px; font-weight: 800; line-height: 1; }
        .stat-card .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .si-blue { background: #eff6ff; color: #2563eb; }
        .si-green { background: #ecfdf5; color: #059669; }
        .si-orange { background: #fff7ed; color: #ea580c; }
        .si-purple { background: #f5f3ff; color: #7c3aed; }

        /* 提示条 */
        .alert-custom {
            padding: 14px 20px; border-radius: var(--radius-sm); margin-bottom: 20px;
            font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px;
        }
        .alert-custom.success { background: var(--success-light); color: var(--success); border: 1px solid #a7f3d0; }
        .alert-custom.error { background: var(--danger-light); color: var(--danger); border: 1px solid #fecaca; }
        .alert-custom .close-alert { margin-left: auto; cursor: pointer; opacity: .6; font-size: 18px; background: none; border: none; color: inherit; }
        .alert-custom .close-alert:hover { opacity: 1; }

        /* 筛选标签 */
        .filter-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-tab {
            padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
            background: #f1f5f9; color: var(--text-muted); cursor: pointer;
            border: none; transition: all .2s;
        }
        .filter-tab:hover { background: #e2e8f0; }
        .filter-tab.active { background: var(--primary); color: #fff; }

        /* 订单卡片 */
        .order-list { display: flex; flex-direction: column; gap: 14px; }
        .order-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
            box-shadow: var(--shadow); transition: all .2s;
        }
        .order-card:hover { box-shadow: var(--shadow-md); }
        .order-card .order-top {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px; border-bottom: 1px solid #f1f5f9;
            flex-wrap: wrap; gap: 12px;
        }
        .order-card .order-no {
            font-size: 13px; color: var(--text-muted); font-weight: 500;
            display: flex; align-items: center; gap: 8px;
        }
        .order-card .order-no code { background: #f1f5f9; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .status-badge {
            padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-paid { background: #d1fae5; color: #065f46; }
        .status-cancelled { background: #f1f5f9; color: #64748b; }
        .status-missed { background: #fee2e2; color: #991b1b; }

        .order-card .order-body {
            display: flex; padding: 20px 24px; gap: 24px; flex-wrap: wrap;
        }
        .order-body .info-group {
            display: flex; flex-direction: column; gap: 4px; min-width: 100px;
        }
        .info-group .info-label { font-size: 11px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
        .info-group .info-value { font-size: 15px; font-weight: 600; color: var(--text); }
        .info-group .info-sub { font-size: 12px; color: var(--text-muted); }

        .order-card .order-actions {
            padding: 14px 24px; border-top: 1px solid #f1f5f9;
            display: flex; gap: 10px; flex-wrap: wrap;
            background: #fafbfc;
        }
        .btn-action {
            padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
            text-decoration: none; cursor: pointer; border: none;
            transition: all .2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-pay { background: var(--success); color: #fff; }
        .btn-pay:hover { background: #047857; box-shadow: 0 4px 12px rgba(5,150,105,.3); }
        .btn-cancel-pending { background: #fff; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-cancel-pending:hover { background: #f1f5f9; }
        .btn-refund { background: #fff; color: var(--danger); border: 1px solid #fecaca; }
        .btn-refund:hover { background: var(--danger-light); }
        .btn-detail { background: #fff; color: var(--primary); border: 1px solid #bfdbfe; }
        .btn-detail:hover { background: var(--primary-light); }

        /* 倒计时 */
        .countdown {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 12px; border-radius: 6px;
            background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 700;
        }
        .countdown.urgent { background: #fee2e2; color: #991b1b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

        /* 空状态 */
        .empty-state {
            background: #fff; border: 2px dashed var(--border); border-radius: var(--radius);
            padding: 70px 20px; text-align: center; color: var(--text-muted);
        }
        .empty-state i { font-size: 64px; display: block; margin-bottom: 16px; opacity: .35; }
        .empty-state h4 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
        .empty-state .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 10px 28px; background: var(--primary); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 16px; transition: all .2s; }
        .empty-state .btn-back:hover { background: var(--primary-dark); box-shadow: 0 4px 12px rgba(37,99,235,.3); }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .order-body { flex-direction: column; gap: 12px; }
        }
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav class="navbar-custom">
    <div class="nav-inner">
        <a href="/" class="brand"><div class="logo-icon"><i class="bi bi-hospital"></i></div>门诊挂号系统</a>
        <div class="nav-actions">
            <div class="user-badge" th:if="${patientName != null}">
                <div class="avatar-sm" th:text="${#strings.length(patientName) > 0 ? #strings.substring(patientName, #strings.length(patientName) - 2, #strings.length(patientName)) : '患'}"></div>
                <span th:text="${patientName}"></span>
            </div>
            <a href="/" class="nav-btn nav-btn-primary"><i class="bi bi-plus-circle"></i> 继续挂号</a>
            <a href="/reg/login" class="nav-btn nav-btn-outline"><i class="bi bi-box-arrow-right"></i> 切换用户</a>
        </div>
    </div>
</nav>

<div class="main-container">
    <!-- 页面头 -->
    <div class="page-header">
        <h2>📋 我的挂号记录</h2>
        <div class="header-right">
            <a href="/" class="nav-btn nav-btn-primary"><i class="bi bi-plus-circle"></i> 新挂号</a>
        </div>
    </div>

    <!-- 提示消息 -->
    <div th:if="${successMsg != null}" class="alert-custom success" id="successAlert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMsg}"></span>
        <button class="close-alert" onclick="this.parentElement.remove()">&times;</button>
    </div>
    <div th:if="${errorMsg != null}" class="alert-custom error" id="errorAlert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMsg}"></span>
        <button class="close-alert" onclick="this.parentElement.remove()">&times;</button>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon si-blue"><i class="bi bi-journal-text"></i></div>
            <div><div class="stat-num" th:text="${totalCount}">0</div><div class="stat-label">全部订单</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon si-orange"><i class="bi bi-hourglass-split"></i></div>
            <div><div class="stat-num" th:text="${pendingCount}">0</div><div class="stat-label">待支付</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon si-green"><i class="bi bi-check2-circle"></i></div>
            <div><div class="stat-num" th:text="${paidCount}">0</div><div class="stat-label">已预约</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon si-purple"><i class="bi bi-wallet2"></i></div>
            <div>
                <div class="stat-num" th:text="${totalAmount != null ? totalAmount : '0'}" style="font-size:20px;">0</div>
                <div class="stat-label">挂号费用合计(元)</div>
            </div>
        </div>
    </div>

    <!-- 筛选 -->
    <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterOrders('all', this)">全部</button>
        <button class="filter-tab" onclick="filterOrders('PENDING', this)">⏳ 待支付</button>
        <button class="filter-tab" onclick="filterOrders('PAID', this)">✅ 已预约</button>
        <button class="filter-tab" onclick="filterOrders('CANCELLED', this)">❌ 已取消</button>
    </div>

    <!-- 订单列表 -->
    <div class="order-list" id="orderList">
        <div class="order-card" th:each="order : ${orders}" th:attr="data-status=${order.orderStatus}">
            <!-- 顶部：流水号 + 状态 -->
            <div class="order-top">
                <div class="order-no">
                    <i class="bi bi-receipt"></i> 流水号 <code th:text="${order.serialNo}"></code>
                    <!-- 待支付倒计时 -->
                    <span class="countdown" th:if="${order.orderStatus == 'PENDING' and order.remainingSeconds > 0}"
                          th:attr="data-expire=${order.remainingSeconds},data-oid=${order.orderId}"
                          th:id="'cd-' + ${order.orderId}">
                        ⏱ <span th:text="${order.remainingSeconds} + '秒'"></span>后过期
                    </span>
                    <span class="countdown urgent" th:if="${order.orderStatus == 'PENDING' and order.remainingSeconds <= 0}">
                        ⚠ 已超时
                    </span>
                </div>

                <!-- 状态徽章 - 待支付 -->
                <span class="status-badge status-pending" th:if="${order.orderStatus == 'PENDING'}">
                    <i class="bi bi-clock"></i> 待支付
                </span>
                <!-- 状态徽章 - 已预约 -->
                <span class="status-badge status-paid" th:if="${order.orderStatus == 'PAID'}">
                    <i class="bi bi-check-circle-fill"></i> 已预约
                </span>
                <!-- 状态徽章 - 已取消 -->
                <span class="status-badge status-cancelled" th:if="${order.orderStatus == 'CANCELLED'}">
                    <i class="bi bi-x-circle-fill"></i> 已取消/已退号
                </span>
                <!-- 状态徽章 - 已爽约 -->
                <span class="status-badge status-missed" th:if="${order.orderStatus == 'MISSED'}">
                    <i class="bi bi-exclamation-triangle-fill"></i> 已爽约
                </span>
            </div>

            <!-- 中间：详细信息 -->
            <div class="order-body">
                <div class="info-group">
                    <div class="info-label"><i class="bi bi-building"></i> 就诊科室</div>
                    <div class="info-value" th:text="${order.deptName}">-</div>
                </div>
                <div class="info-group">
                    <div class="info-label"><i class="bi bi-person-badge"></i> 就诊医生</div>
                    <div class="info-value" th:text="${order.doctorName}">-</div>
                    <div class="info-sub" th:text="${order.doctorTitle}" th:if="${order.doctorTitle != null and order.doctorTitle != ''}"></div>
                </div>
                <div class="info-group">
                    <div class="info-label"><i class="bi bi-calendar-event"></i> 就诊时间</div>
                    <div class="info-value" th:if="${order.visitTime != null}" th:text="${#temporals.format(order.visitTime, 'yyyy-MM-dd HH:mm')}">-</div>
                    <div class="info-value" th:unless="${order.visitTime != null}" th:text="${order.visitDate}">-</div>
                    <div class="info-sub" th:if="${order.slotStartTime != null}" th:text="${order.slotStartTime} + ' ~ ' + ${order.slotEndTime}"></div>
                </div>
                <div class="info-group">
                    <div class="info-label"><i class="bi bi-cash-coin"></i> 挂号费用</div>
                    <div class="info-value" style="color:#e11d48;" th:text="'¥' + ${order.payAmount}">-</div>
                </div>
                <div class="info-group">
                    <div class="info-label"><i class="bi bi-clock-history"></i> 下单时间</div>
                    <div class="info-value" style="font-size:14px;" th:text="${order.orderTime != null ? #temporals.format(order.orderTime, 'MM-dd HH:mm') : '-'}">-</div>
                </div>
                <div class="info-group" th:if="${order.cancelReason != null}">
                    <div class="info-label"><i class="bi bi-info-circle"></i> 取消原因</div>
                    <div class="info-value" style="font-size:13px;color:var(--text-muted);" th:text="${order.cancelReason}">-</div>
                </div>
            </div>

            <!-- 底部：操作按钮 -->
            <div class="order-actions" th:if="${order.orderStatus == 'PENDING' || order.orderStatus == 'PAID'}">
                <!-- 待支付：支付 + 取消 -->
                <a th:if="${order.orderStatus == 'PENDING'}"
                   th:href="@{/reg/pay(orderId=${order.orderId})}"
                   class="btn-action btn-pay"
                   onclick="return confirm('确认支付 ¥' + ${order.payAmount} + ' 吗？')">
                    <i class="bi bi-credit-card"></i> 立即支付
                </a>
                <a th:if="${order.orderStatus == 'PENDING'}"
                   th:href="@{/reg/cancelPending(orderId=${order.orderId})}"
                   class="btn-action btn-cancel-pending"
                   onclick="return confirm('确认取消此订单吗？取消后号源将自动释放。')">
                    <i class="bi bi-x-circle"></i> 取消订单
                </a>

                <!-- 已支付：退号 -->
                <a th:if="${order.orderStatus == 'PAID'}"
                   th:href="@{/reg/cancel(orderId=${order.orderId})}"
                   class="btn-action btn-refund"
                   onclick="return confirm('确认办理退号吗？\n退号后号源将自动释放，费用将按医院规定退还。')">
                    <i class="bi bi-arrow-repeat"></i> 办理退号
                </a>

                <button class="btn-action btn-detail" onclick="showDetail(this)"
                        th:attr="data-id=${order.orderId}">
                    <i class="bi bi-three-dots"></i> 详情
                </button>
            </div>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
            <i class="bi bi-inbox"></i>
            <h4>暂无挂号记录</h4>
            <p>您还没有任何挂号订单，快去预约吧！</p>
            <a href="/" class="btn-back"><i class="bi bi-plus-circle"></i> 立即挂号</a>
        </div>
    </div>
</div>

<script>
    // 自动关闭提示
    setTimeout(() => {
        const alerts = document.querySelectorAll('.alert-custom');
        alerts.forEach(a => { a.style.transition = 'opacity .3s'; a.style.opacity = '0'; });
        setTimeout(() => alerts.forEach(a => a.remove()), 350);
    }, 4000);

    // 筛选功能
    function filterOrders(status, btn) {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.order-card').forEach(card => {
            if (status === 'all' || card.dataset.status === status) {
                card.style.display = '';
            } else {
                card.style.display = 'none';
            }
        });
    }

    // 倒计时更新
    document.querySelectorAll('.countdown[data-expire]').forEach(el => {
        let seconds = parseInt(el.dataset.expire);
        const oid = el.dataset.oid;
        const interval = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(interval);
                el.classList.add('urgent');
                el.innerHTML = '⚠ 已超时';
                return;
            }
            if (seconds <= 300) el.classList.add('urgent'); // 5分钟内变红
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            el.innerHTML = '⏱ <span>' + (mins > 0 ? mins + '分' : '') + secs + '秒</span>后过期';
        }, 1000);
    });

    // 订单详情(占位)
    function showDetail(btn) {
        const orderId = btn.dataset.id;
        alert('订单ID: ' + orderId + '\n详情功能已就绪，可扩展查看完整订单信息。');
    }
</script>
</body>
</html>
