<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择时段 - 门诊挂号系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-light: #eff6ff; --primary-dark: #1d4ed8;
            --success: #059669; --success-light: #ecfdf5;
            --danger: #dc2626; --danger-light: #fef2f2;
            --warning: #d97706;
            --text: #1e293b; --text-muted: #64748b;
            --bg: #f8fafc; --card-bg: #fff; --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,.1);
            --radius: 16px; --radius-sm: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #f0f9ff 0%, #faf5ff 30%, #f0fdf4 70%, #fffbeb 100%);
            min-height: 100vh; color: var(--text);
        }

        .navbar-custom {
            background: rgba(255,255,255,.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000; padding: 0 24px;
        }
        .nav-inner { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
        .brand .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
        .user-badge { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--primary-light); border-radius: 20px; font-size: 14px; font-weight: 500; color: var(--primary); }
        .avatar-sm { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

        .main-container { max-width: 1120px; margin: 0 auto; padding: 32px 24px 80px; }

        .breadcrumb-custom { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; font-size: 14px; flex-wrap: wrap; }
        .breadcrumb-custom a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb-custom a:hover { color: var(--primary); }
        .breadcrumb-custom .sep { color: #cbd5e1; }
        .breadcrumb-custom .current { color: var(--text); font-weight: 600; }

        .steps { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 32px; }
        .step { display: flex; align-items: center; gap: 8px; padding: 8px 20px; background: #fff; border: 1px solid var(--border); border-radius: 24px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .step.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(37,99,235,.25); }
        .step.done { background: var(--success-light); color: var(--success); border-color: #a7f3d0; }
        .step-line { width: 40px; height: 2px; background: var(--border); }
        .step-line.done { background: var(--success); }

        /* 医生摘要卡片 */
        .summary-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px 28px;
            margin-bottom: 28px; box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
        }
        .summary-card .doc-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg,#3b82f6,#2563eb);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 24px; font-weight: 700; flex-shrink: 0;
        }
        .summary-card .summary-info { flex: 1; min-width: 200px; }
        .summary-card .summary-info h4 { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
        .summary-card .summary-info .meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap; }
        .summary-card .summary-info .meta span { display: flex; align-items: center; gap: 4px; }
        .summary-card .fee-tag {
            padding: 6px 16px; background: #fff5f5; color: #e11d48;
            border-radius: 8px; font-weight: 700; font-size: 15px;
            border: 1px solid #fecaca;
        }

        /* 时段网格 */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--primary); }
        .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
        .slot-card {
            background: var(--card-bg); border: 2px solid var(--border);
            border-radius: var(--radius); padding: 22px 18px;
            text-align: center; transition: all .25s ease;
            box-shadow: var(--shadow); cursor: pointer;
            position: relative; overflow: hidden;
        }
        .slot-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .slot-card.sold-out { cursor: not-allowed; opacity: .65; border-color: #f1f5f9; background: #fafbfc; }
        .slot-card.sold-out:hover { transform: none; box-shadow: var(--shadow); border-color: #f1f5f9; }
        .slot-card .time-range { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .slot-card .remain-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .remain-ok { background: var(--success-light); color: var(--success); }
        .remain-few { background: #fffbeb; color: #d97706; }
        .remain-zero { background: var(--danger-light); color: var(--danger); }
        .slot-card .btn-slot {
            margin-top: 12px; width: 100%; padding: 10px;
            border-radius: 8px; font-weight: 600; font-size: 14px;
            border: none; background: var(--primary); color: #fff;
            transition: all .2s; cursor: pointer;
        }
        .slot-card .btn-slot:hover { background: var(--primary-dark); box-shadow: 0 4px 12px rgba(37,99,235,.3); }
        .slot-card.sold-out .btn-slot { background: #cbd5e1; cursor: not-allowed; }
        .slot-card.sold-out .btn-slot:hover { box-shadow: none; }

        .empty-state {
            grid-column: 1 / -1; background: #fff; border: 2px dashed var(--border);
            border-radius: var(--radius); padding: 60px 20px; text-align: center; color: var(--text-muted);
        }
        .empty-state i { font-size: 56px; display: block; margin-bottom: 12px; opacity: .4; }
        .empty-state h4 { font-size: 18px; margin-bottom: 6px; color: var(--text); }
        .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; background: var(--primary); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 16px; transition: all .2s; }
        .btn-back:hover { background: var(--primary-dark); }

        /* Toast通知 */
        .toast-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.4); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .toast-overlay .toast-box {
            background: #fff; border-radius: var(--radius); padding: 32px 28px;
            text-align: center; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.2);
            animation: toastIn .3s ease;
        }
        @keyframes toastIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
        .toast-box .toast-icon { font-size: 48px; margin-bottom: 12px; }
        .toast-box .toast-icon.success { color: var(--success); }
        .toast-box .toast-icon.error { color: var(--danger); }
        .toast-box h4 { margin-bottom: 8px; }
        .toast-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        .toast-box .btn { padding: 10px 28px; border-radius: 8px; font-weight: 600; }

        @media (max-width: 640px) { .slot-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

<nav class="navbar-custom">
    <div class="nav-inner">
        <a href="/" class="brand"><div class="logo-icon"><i class="bi bi-hospital"></i></div>门诊挂号系统</a>
        <div class="user-badge" th:if="${patientName != null}">
            <div class="avatar-sm" th:text="${#strings.length(patientName) > 0 ? #strings.substring(patientName, #strings.length(patientName) - 2, #strings.length(patientName)) : '患'}"></div>
            <span th:text="${patientName}"></span>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="breadcrumb-custom">
        <a href="/"><i class="bi bi-house"></i> 首页</a><span class="sep">›</span>
        <a th:href="@{/reg/schedule(deptId=${schedule.deptId}, visitDate=${visitDate})}">选择医生</a>
        <span class="sep">›</span>
        <span class="current">选择时段</span>
    </div>

    <div class="steps">
        <span class="step done"><i class="bi bi-check-circle"></i> 日期与科室</span>
        <span class="step-line done"></span>
        <span class="step done"><i class="bi bi-check-circle"></i> 选择医生</span>
        <span class="step-line done"></span>
        <span class="step active"><i class="bi bi-3-circle-fill"></i> 选择时段</span>
        <span class="step-line"></span>
        <span class="step">确认挂号</span>
    </div>

    <!-- 医生摘要 -->
    <div class="summary-card">
        <div class="doc-avatar" th:text="${#strings.length(doctorName) > 0 ? #strings.substring(doctorName, #strings.length(doctorName) - 2, #strings.length(doctorName)) : '医'}"></div>
        <div class="summary-info">
            <h4 th:text="${doctorName}"></h4>
            <div class="meta">
                <span><i class="bi bi-calendar-check"></i> <span th:text="${#temporals.format(visitDate, 'yyyy年MM月dd日')}"></span></span>
                <span><i class="bi bi-clock"></i> <span th:text="${schedule.startTime} + '~' + ${schedule.endTime}"></span></span>
            </div>
        </div>
        <div class="fee-tag" th:text="'¥' + ${schedule.registrationFee}"></div>
    </div>

    <!-- 时段选择 -->
    <div class="section-title"><i class="bi bi-grid-3x3-gap-fill"></i> 选择就诊时段</div>
    <div class="slot-grid">
        <div th:each="ns : ${numberSources}" class="slot-card" th:classappend="${ns.remainingCount == 0} ? 'sold-out' : ''">
            <div class="time-range" th:text="${ns.slotStartTime} + ' ~ ' + ${ns.slotEndTime}"></div>

            <!-- 有号源 -->
            <div th:if="${ns.remainingCount > 0}">
                <div class="remain-badge" th:classappend="${ns.remainingCount <= 3} ? 'remain-few' : 'remain-ok'">
                    <i class="bi bi-check-circle"></i>
                    <span th:text="'剩余 ' + ${ns.remainingCount} + ' 个号源'"></span>
                </div>
                <button class="btn-slot"
                        th:onclick="|submitReg(${ns.sourceId}, ${schedule.scheduleId}, ${schedule.doctorId}, ${schedule.deptId}, ${schedule.registrationFee})|">
                    立即挂号
                </button>
            </div>

            <!-- 已约满 -->
            <div th:if="${ns.remainingCount == 0}">
                <div class="remain-badge remain-zero">
                    <i class="bi bi-x-circle"></i>
                    <span>已约满</span>
                </div>
                <button class="btn-slot" disabled>已约满</button>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(numberSources)}" class="empty-state">
            <i class="bi bi-inbox"></i>
            <h4>暂无可用号源</h4>
            <p>该医生暂无可用时段，请返回选择其他医生</p>
            <a th:href="@{/reg/schedule(deptId=${schedule.deptId}, visitDate=${visitDate})}" class="btn-back">
                <i class="bi bi-arrow-left"></i> 返回选择医生
            </a>
        </div>
    </div>
</div>

<!-- Toast弹窗 -->
<div class="toast-overlay" id="toastOverlay" style="display:none;">
    <div class="toast-box">
        <div class="toast-icon" id="toastIcon"></div>
        <h4 id="toastTitle"></h4>
        <p id="toastMsg"></p>
        <button class="btn btn-primary" id="toastBtn" onclick="closeToast()">确定</button>
    </div>
</div>

<script>
    function submitReg(sourceId, scheduleId, doctorId, deptId, payAmount) {
        if (!confirm('确认使用当前时段挂号吗？挂号费：¥' + payAmount + '\n请在30分钟内完成支付，否则订单将自动取消。')) {
            return;
        }
        fetch('/reg/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'sourceId=' + sourceId + '&scheduleId=' + scheduleId + '&doctorId=' + doctorId + '&deptId=' + deptId + '&payAmount=' + payAmount
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                showToast('success', '挂号成功！', data.message || '请在30分钟内完成支付', '/reg/my');
            } else {
                showToast('error', '挂号失败', data.message || '请稍后重试', null);
            }
        })
        .catch(() => {
            showToast('error', '网络错误', '请检查网络连接后重试', null);
        });
    }

    function showToast(type, title, msg, redirectUrl) {
        document.getElementById('toastIcon').className = 'toast-icon ' + type;
        document.getElementById('toastIcon').innerHTML = type === 'success'
            ? '<i class="bi bi-check-circle-fill" style="font-size:48px;color:#059669;"></i>'
            : '<i class="bi bi-x-circle-fill" style="font-size:48px;color:#dc2626;"></i>';
        document.getElementById('toastTitle').textContent = title;
        document.getElementById('toastMsg').textContent = msg;
        const btn = document.getElementById('toastBtn');
        if (redirectUrl) {
            btn.textContent = '查看我的挂号';
            btn.onclick = function() { window.location.href = redirectUrl; };
        } else {
            btn.textContent = '确定';
            btn.onclick = closeToast;
        }
        document.getElementById('toastOverlay').style.display = 'flex';
    }

    function closeToast() {
        document.getElementById('toastOverlay').style.display = 'none';
    }
</script>
</body>
</html>
