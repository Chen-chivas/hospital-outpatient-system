<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 医院门诊挂号系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --success: #059669;
            --warning: #d97706;
            --text: #1e293b;
            --text-muted: #64748b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,.1);
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #f0f9ff 0%, #faf5ff 30%, #f0fdf4 70%, #fffbeb 100%);
            min-height: 100vh;
            color: var(--text);
        }

        /* ===== 导航栏 ===== */
        .navbar-custom {
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0 24px;
        }
        .navbar-custom .nav-inner {
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: var(--text);
            text-decoration: none;
        }
        .brand .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: var(--primary-light);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
            cursor: default;
        }
        .user-badge .avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all .2s;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .nav-btn-outline:hover { background: #f1f5f9; color: var(--text); }
        .nav-btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .nav-btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,.3); }

        /* ===== 主体 ===== */
        .main-container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }

        /* ===== Hero区域 ===== */
        .hero-section {
            text-align: center;
            padding: 20px 0 36px;
        }
        .hero-section .step-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: var(--primary-light);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 16px;
        }
        .hero-section h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #1e293b, #334155);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .hero-section .subtitle {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* ===== 日期选择卡片 ===== */
        .date-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 28px 32px;
            margin-bottom: 28px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .date-card .section-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--primary);
            margin-bottom: 14px;
        }
        .date-input-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            transition: all .2s;
        }
        .date-input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
        .date-input-wrapper i { font-size: 22px; color: var(--primary); }
        .date-input-wrapper input[type="date"] {
            border: none;
            background: transparent;
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            outline: none;
            font-family: inherit;
            padding: 4px 0;
        }
        .date-hint { color: var(--text-muted); font-size: 13px; margin-top: 10px; }

        /* ===== 科室选择 ===== */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i { color: var(--primary); font-size: 20px; }
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }
        .dept-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 20px;
            cursor: pointer;
            transition: all .25s ease;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }
        .dept-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), #6366f1);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .25s ease;
        }
        .dept-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .dept-card:hover::before { transform: scaleX(1); }
        .dept-card .dept-icon {
            width: 50px; height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .dept-card .dept-info { flex: 1; min-width: 0; }
        .dept-card .dept-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
            margin-bottom: 2px;
        }
        .dept-card .dept-desc {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dept-card .arrow-icon {
            color: #cbd5e1;
            font-size: 18px;
            transition: all .2s;
        }
        .dept-card:hover .arrow-icon { color: var(--primary); transform: translateX(4px); }

        /* 图标配色 - 使用序号匹配 */
        .icon-0 { background: #eff6ff; color: #2563eb; }
        .icon-1 { background: #ecfdf5; color: #059669; }
        .icon-2 { background: #f5f3ff; color: #7c3aed; }
        .icon-3 { background: #fff7ed; color: #ea580c; }
        .icon-4 { background: #fff1f2; color: #e11d48; }
        .icon-5 { background: #ecfeff; color: #0891b2; }
        .icon-6 { background: #fffbeb; color: #d97706; }
        .icon-7 { background: #f0fdfa; color: #0d9488; }
        .icon-8 { background: #eef2ff; color: #4f46e5; }
        .icon-9 { background: #fdf2f8; color: #db2777; }

        /* ===== 底部快捷入口 ===== */
        .quick-links {
            margin-top: 36px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .quick-link {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-muted);
        }
        .quick-link:hover {
            background: #f8fafc;
            color: var(--text);
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }
        .quick-link i { font-size: 16px; }

        @media (max-width: 640px) {
            .dept-grid { grid-template-columns: 1fr; }
            .hero-section h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar-custom">
    <div class="nav-inner">
        <a href="/" class="brand">
            <div class="logo-icon"><i class="bi bi-hospital"></i></div>
            门诊挂号系统
        </a>
        <div class="nav-actions">
            <div class="user-badge">
                <div class="avatar-sm" th:text="${patientName != null && patientName.length() >= 2 ? patientName.substring(patientName.length() - 2) : '患'}"></div>
                <span th:text="${patientName}"></span>
            </div>
            <a href="/reg/my" class="nav-btn nav-btn-outline"><i class="bi bi-journal-text"></i> 我的挂号</a>
            <a href="/reg/logout" class="nav-btn nav-btn-outline"><i class="bi bi-box-arrow-right"></i> 切换用户</a>
        </div>
    </div>
</nav>

<!-- 主内容 -->
<div class="main-container">
    <!-- Hero -->
    <div class="hero-section">
        <div class="step-indicator">
            <i class="bi bi-1-circle-fill"></i> 选择日期与科室
        </div>
        <h1>在线预约挂号</h1>
        <p class="subtitle">选择就诊日期和科室，快速预约专家门诊</p>
    </div>

    <!-- 日期选择 -->
    <div class="date-card">
        <div class="section-label">📅 就诊日期</div>
        <div class="date-input-wrapper">
            <i class="bi bi-calendar3"></i>
            <input type="date" id="visitDate">
        </div>
        <p class="date-hint">可预约未来 7 天内的号源，默认选中明天</p>
    </div>

    <!-- 科室选择 -->
    <div class="section-title">
        <i class="bi bi-building"></i> 选择就诊科室
    </div>
    <div class="dept-grid">
        <div class="dept-card" th:each="dept, iter : ${departments}"
             th:onclick="|goToSchedule(${dept.deptId})|"
             th:attr="data-dept=${dept.deptId}">
            <div class="dept-icon" th:class="'dept-icon icon-' + ${iter.index % 10}">
                <i class="bi bi-clipboard2-pulse"></i>
            </div>
            <div class="dept-info">
                <div class="dept-name" th:text="${dept.deptName}"></div>
                <div class="dept-desc" th:text="${dept.deptDesc} ?: '点击查看出诊医生'"></div>
            </div>
            <i class="bi bi-chevron-right arrow-icon"></i>
        </div>
    </div>

    <!-- 快捷入口 -->
    <div class="quick-links">
        <a href="/reg/my" class="quick-link"><i class="bi bi-clock-history"></i> 挂号记录</a>
        <a href="/reg/login" class="quick-link"><i class="bi bi-people"></i> 切换就诊人</a>
        <a href="/doctor" class="quick-link"><i class="bi bi-laptop"></i> 医生工作台</a>
        <a href="/admin/schedule" class="quick-link"><i class="bi bi-gear"></i> 管理后台</a>
    </div>
</div>

<script>
    // 初始化日期选择器
    (function() {
        const input = document.getElementById('visitDate');
        const today = new Date();
        const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
        const maxDate = new Date(today); maxDate.setDate(maxDate.getDate() + 7);

        const fmt = d => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        };

        input.min = fmt(tomorrow);
        input.max = fmt(maxDate);
        input.value = fmt(tomorrow);
    })();

    function goToSchedule(deptId) {
        const date = document.getElementById('visitDate').value;
        if (!date) { alert('请选择就诊日期'); return; }
        window.location.href = '/reg/schedule?deptId=' + deptId + '&visitDate=' + date;
    }
</script>
</body>
</html>
